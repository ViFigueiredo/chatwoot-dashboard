version: '3.8'

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: api
    ports:
      - "8080:8080"
    env_file:
      - .env.local
    environment:
      - PORT=8080
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: worker
    env_file:
      - .env.local
    environment:
      - CACHE_REFRESH_INTERVAL_MINUTES=30
    restart: unless-stopped
    depends_on:
      - api

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8080
    command: sh -c "npm install && npm run dev -- --host"
