version: '3.8'

networks:
  tunnel:
    external: true
  public:
    external: true

services:
  chatwootbi-api:
    image: ghcr.io/vifigueiredo/chatwootbi:latest
    hostname: chatwootbi-api
    ports:
      - "8080:8080"
    command: ["/api"]
    environment:
      - PORT=8080
      - CHATWOOT_BASE_URL=${CHATWOOT_BASE_URL}
      - CHATWOOT_ACCOUNT_ID=${CHATWOOT_ACCOUNT_ID}
      - CHATWOOT_API_TOKEN=${CHATWOOT_API_TOKEN}
      - DASHBOARD_TOKEN=${DASHBOARD_TOKEN}
      - UPSTASH_REDIS_REST_URL=${UPSTASH_REDIS_REST_URL}
      - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN}
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-86400}
      - REFRESH_RATE_LIMIT_PER_HOUR=${REFRESH_RATE_LIMIT_PER_HOUR:-10}
    restart: unless-stopped
    networks:
      - tunnel
      - public

  chatwootbi-worker:
    image: ghcr.io/vifigueiredo/chatwootbi:latest
    hostname: chatwootbi-worker
    command: ["/worker"]
    environment:
      - CHATWOOT_BASE_URL=${CHATWOOT_BASE_URL}
      - CHATWOOT_ACCOUNT_ID=${CHATWOOT_ACCOUNT_ID}
      - CHATWOOT_API_TOKEN=${CHATWOOT_API_TOKEN}
      - UPSTASH_REDIS_REST_URL=${UPSTASH_REDIS_REST_URL}
      - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN}
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-86400}
      - CACHE_REFRESH_INTERVAL_MINUTES=${CACHE_REFRESH_INTERVAL_MINUTES:-30}
      - FETCH_CONCURRENCY=${FETCH_CONCURRENCY:-8}
    restart: unless-stopped
    depends_on:
      - chatwootbi-api
    networks:
      - tunnel
      - public

  chatwootbi-frontend:
    image: ghcr.io/vifigueiredo/chatwootbi-frontend:latest
    hostname: chatwootbi-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8080}
    restart: unless-stopped
    networks:
      - tunnel
      - public
